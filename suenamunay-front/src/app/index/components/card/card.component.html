<section *ngFor="let data of data" class="col s12 m3">
    <section class="card">
        <section class="card-image waves-effect waves-block waves-light">
            <img class="activator" src="./assets/images/EduBOT0.jpeg" />
        </section>
        <section class="card-content">
            <span
            class="card-title text-center activator grey-text text-darken-4"
            >{{ data.edubot.title }}</span
            >
            <!--<p><a href="#">Ver más.</a></p>-->
        </section>
        <section class="card-reveal">
            <span class="card-title grey-text text-darken-4"
            >{{ data.sumaletiempo.title }}<i class="material-icons right grey-text text-darken-4"
                >close</i
            ></span
            >
            <p class="grey-text text-darken-4">
                {{ data.edubot.body }}
            </p>
        </section>
    </section>
</section>
